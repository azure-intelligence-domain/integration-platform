# Who may publish to which domain topic (evgt-intplat-<topic>), by runtime identity (ADR 0014).
# Every identity may publish to the platform topic (deployment events); that needs no entry here.
producers:
  - identity: id-intplat-process-api-order-runtime
    topics: [order]
  - identity: id-intplat-system-api-sap-runtime
    topics: [finance]
  - identity: id-intplat-system-api-wms-runtime
    topics: [supply]
  - identity: id-intplat-system-api-3pl-runtime
    topics: [logistics]
