# APIs the gateways serve (ADR 0014). Each is imported from the openapi.yaml of a released
# version of its repository, so the gateway serves exactly what the contract says.
#
#   name        API id on the gateway (and in the tap: componentid)
#   repository  repository in azure-intelligence-domain; release: the tag whose openapi.yaml is served
#   path        URL path on the gateway (no version: adidas guidelines)
#   backend     Function app that implements it (https://<backend>.azurewebsites.net)
#   gateways    gateway → product: people (apim-intplat-demo), agents (apim-intplat-agents).
#               Products without a subscription key (staff.yaml, internal-callers.yaml):
#                 webshop, customer-service, partners  people: staff, signed in with Google (ADR 0017)
#                 process-apis, system-apis           building blocks only, with an Entra token
apis:
  # Experience layer (step 7): what people, websites and partners use.
  - name: experience-api-webshop
    repository: experience-api-webshop
    release: v1.0.0
    path: webshop
    backend: func-intplat-experience-api-webshop
    gateways:
      people: webshop

  - name: experience-api-customer-service
    repository: experience-api-customer-service
    release: v1.0.0
    path: customer-service
    backend: func-intplat-experience-api-customer-service
    gateways:
      people: customer-service
      agents: agents

  # No code of its own: the gateway serves the partner's view of the 3PL System API.
  - name: experience-api-partner
    repository: experience-api-partner
    release: v1.0.0
    path: partner
    backend: func-intplat-system-api-3pl
    gateways:
      people: partners

  # Process layer: building blocks call it; agents too, through their own gateway.
  - name: process-api-order
    repository: process-api-order
    release: v1.2.0
    path: order
    backend: func-intplat-process-api-order
    gateways:
      people: process-apis
      agents: agents

  # System layer: building blocks only.
  - name: system-api-salesforce
    repository: system-api-salesforce
    release: v1.1.0
    path: salesforce
    backend: func-intplat-system-api-salesforce
    gateways:
      people: system-apis

  - name: system-api-sap
    repository: system-api-sap
    release: v1.2.0
    path: sap
    backend: func-intplat-system-api-sap
    gateways:
      people: system-apis

  - name: system-api-wms
    repository: system-api-wms
    release: v1.1.0
    path: wms
    backend: func-intplat-system-api-wms
    gateways:
      people: system-apis

  - name: system-api-3pl
    repository: system-api-3pl
    release: v1.1.0
    path: 3pl
    backend: func-intplat-system-api-3pl
    gateways:
      people: system-apis
