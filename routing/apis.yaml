# APIs the gateways serve (ADR 0014). Each is imported from the openapi.yaml of a released
# version of its repository, so the gateway serves exactly what the contract says.
#
#   name        API id on the gateway (and in the tap: componentid)
#   repository  repository in azure-intelligence-domain; release: the tag whose openapi.yaml is served
#   path        URL path on the gateway (no version: adidas guidelines)
#   backend     Function app that implements it (https://<backend>.azurewebsites.net)
#   gateways    gateway → product: people (apim-intplat-demo), agents (apim-intplat-agents).
#               Product system-apis: building blocks only, with an Entra token (internal-callers.yaml).
apis:
  - name: process-api-order
    repository: process-api-order
    release: v0.1.0
    path: order
    backend: func-intplat-process-api-order
    gateways:
      people: processes
      agents: agents
